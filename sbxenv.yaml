# 🛡️ 安全コース（Docker Sandboxes）用の設定。`sbx env run` で使われます。
# - sandbox の名前を固定
# - 地図アプリのポート（2D: 5173 / 3D: 5174）を手元のブラウザから見えるようにする
# ※ lifecycle のコマンドは「手元の PC」で実行され、sbx exec で sandbox の中に指示を送ります。
schemaVersion: "1"
name: links-hackathon-2026
agent: claude
workspace: .
# sandbox に割り当てる CPU とメモリ（PC が重くなりすぎないように控えめに。npm install・ビルド・デプロイは 2CPU/4GB で確認済み）
sandboxOptions:
  cpus: 2
  memory: 4g
  template: docker/sbx-kit-claude:latest
# 🧪 上級オプション: Claude にブラウザ操作（画面の確認・テスト）をさせたいときは、
#    次の2行の先頭の「# 」を消してから sandbox を作り直してください（sbx env rm → sbx env run）。
#    Node.js 24 と Playwright が入ります（作成に1〜2分かかります）。
# kits:
#   - docker.io/sbx/playwright:1.61.1
ports:
  - sandbox: 5173
    host: 5173
  - sandbox: 5174
    host: 5174
lifecycle:
  postCreate:
    - name: AWS MCP サーバーへの通信を許可（この sandbox だけ）
      command: sbx policy allow network --sandbox links-hackathon-2026 aws-mcp.us-east-1.api.aws:443
      timeout: 1m
    - name: AWS プラグイン（aws-core）を sandbox にインストール
      command: sbx exec links-hackathon-2026 claude plugin install aws-core@anthropic-plugin-directory --scope project
      timeout: 5m
